name: Publicar laboratorios EASC-342 en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Comprobar y publicar sitio estatico
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Verificar y preparar seis laboratorios
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s README.md
          test -f .nojekyll
          files=(
            Unidad_1_Arquitectura_Decisiones.html
            Unidad_2_Contratos_APIs.html
            Unidad_3_RAG_Evidencia.html
            Unidad_4_Agentes_Aprobaciones.html
            Unidad_5_Interfaces_Usabilidad.html
            Unidad_6_Observabilidad_Rollback.html
          )
          for file in "${files[@]}"; do
            test -s "Interactivos/$file" || { echo "::error::No existe Interactivos/$file"; exit 1; }
            grep -Fq "./Interactivos/$file" index.html || { echo "::error::Falta el enlace $file"; exit 1; }
          done
          mkdir -p _site
          cp index.html README.md .nojekyll _site/
          cp -R Interactivos _site/
          if [ -d Material ]; then cp -R Material _site/; fi
          echo "Contenido listo: seis laboratorios, portada y documentacion."

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Publicar sitio en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
